name: Feature request
description: Propose a new feature or an enhancement to WABA-CRM.
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve WABA-CRM! Please describe the use case, problem, or feature idea below.
        Before submitting, check existing issues and pull requests to ensure it hasn't been proposed yet.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem are you trying to solve, or what workflow would this feature enable?
      placeholder: |
        Describe the problem clearly. Example: When reviewing broadcasts, I need to see which recipients did not reply so I can trigger a follow-up automation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
      placeholder: |
        A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any screenshots, mockups, or relevant links here.
